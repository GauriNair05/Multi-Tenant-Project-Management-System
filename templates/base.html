<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Multi-Tenant Project Manager{% endblock %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-indigo-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="font-bold text-lg">Tenant Project Manager</h1>
            <span class="text-sm bg-indigo-700 px-3 py-1 rounded">Django + HTMX</span>
        </div>
    </nav>

    <main class="container mx-auto p-6">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
