<div id="task-list" class="space-y-3">
    {% for task in tasks %}
        <div class="p-4 bg-gray-50 rounded-lg border border-gray-200 flex justify-between items-center shadow-xs">
            <div>
                <h4 class="font-medium text-gray-800">{{ task.title }}</h4>
                <p class="text-xs text-gray-500 mt-1">{{ task.description|default:"No description provided." }}</p>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-xs px-2.5 py-1 rounded-full font-mono bg-blue-100 text-blue-800">{{ task.get_status_display }}</span>
                <span class="text-xs px-2.5 py-1 rounded-full font-mono bg-amber-100 text-amber-800">{{ task.get_priority_display }}</span>
            </div>
        </div>
    {% empty %}
        <p class="text-gray-500 text-sm">No tasks created for this project yet.</p>
    {% endfor %}
</div>
