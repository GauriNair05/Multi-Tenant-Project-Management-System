{% extends 'base.html' %}

{% block content %}
<div class="space-y-6">
    <!-- Project Header -->
    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 flex justify-between items-center">
        <div>
            <div class="flex items-center space-x-3">
                <h2 class="text-2xl font-bold text-gray-800">{{ project.name }}</h2>
                <span class="text-sm bg-indigo-100 text-indigo-800 px-3 py-1 rounded font-mono">[{{ project.key }}]</span>
            </div>
            <p class="text-gray-600 mt-1">Organization: <span class="font-semibold">{{ project.organization.name }}</span></p>
        </div>
        <a href="{% url 'dashboard' %}" class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-md transition">Back to Dashboard</a>
    </div>

    <!-- Main Content Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Task Creation Form (HTMX powered) -->
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 lg:col-span-1 h-fit">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Create New Task</h3>
            <form hx-post="{% url 'create_task' project.id %}" 
                  hx-target="#task-list" 
                  hx-swap="innerHTML"
                  class="space-y-4"
                  _="on submit reset() me">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Task Title</label>
                    <input type="text" name="title" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                    <textarea name="description" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
                    <select name="priority" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="LOW">Low</option>
                        <option value="MEDIUM" selected>Medium</option>
                        <option value="HIGH">High</option>
                        <option value="URGENT">Urgent</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-md transition">Add Task</button>
            </form>
        </div>

        <!-- Task List Container -->
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 lg:col-span-2">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Project Tasks</h3>
            {% include 'partials/task_list.html' %}
        </div>

    </div>
</div>
{% endblock %}
